name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  # By hand, on any ref: the whole of CI, and then that ref's image (ADR-0060).
  workflow_dispatch:

# Read-only for every job; the image job widens it for itself.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install system libraries
        timeout-minutes: 5
        uses: ./.github/actions/install-system-libraries
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --all-targets

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install system libraries
        timeout-minutes: 5
        uses: ./.github/actions/install-system-libraries
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test

  clippy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install system libraries
        timeout-minutes: 5
        uses: ./.github/actions/install-system-libraries
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy -- -D warnings

  # Scripting (Starlark + SQLite) is a default cargo feature; the binary
  # must also build without it (ADR-0024).
  no-default-features:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install system libraries
        timeout-minutes: 5
        uses: ./.github/actions/install-system-libraries
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --no-default-features
      - run: cargo clippy --all-targets --no-default-features -- -D warnings
      - run: cargo test --no-default-features --test e2e

  fmt:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --check

  docs-drift:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install system libraries
        timeout-minutes: 5
        uses: ./.github/actions/install-system-libraries
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo run --example gen_docs
      - name: Fail if generated docs drift from committed
        run: |
          if ! git diff --exit-code website/src/content/docs/reference/indicators.md; then
            echo "::error::indicators.md is out of sync. Run 'cargo run --example gen_docs' and commit the result." >&2
            exit 1
          fi

  mcp-types-drift:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install system libraries
        timeout-minutes: 5
        uses: ./.github/actions/install-system-libraries
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: scripts/gen-mcp-types/package-lock.json
      - run: ./scripts/gen-mcp-types.sh
      - name: Fail if generated MCP types drift from committed
        run: |
          if ! git diff --exit-code web/src/types/generated-input.ts; then
            echo "::error::web/src/types/generated-input.ts is out of sync. Run './scripts/gen-mcp-types.sh' and commit the result." >&2
            exit 1
          fi

  build-release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [check, clippy, fmt]
    steps:
      - uses: actions/checkout@v4
      - name: Install system libraries
        timeout-minutes: 5
        uses: ./.github/actions/install-system-libraries
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release
      - uses: actions/upload-artifact@v4
        with:
          name: chartgen-linux-x86_64
          path: target/release/chartgen

  # The macOS release binaries are only built on a tag: this finds out before then. Their
  # OpenSSL is vendored (ADR-0045), so a Mac without Homebrew's can start them.
  macos-build:
    runs-on: macos-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        target: [aarch64-apple-darwin, x86_64-apple-darwin]
    steps:
      - uses: actions/checkout@v4
      - run: brew install fontconfig freetype pkg-config
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - run: cargo build --bin chartgen --target ${{ matrix.target }}
      - name: No OpenSSL to find at run time
        run: "! otool -L target/${{ matrix.target }}/debug/chartgen | grep -E 'libssl|libcrypto'"

  web-unit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install web deps
        working-directory: web
        run: npm ci
      - name: Run unit tests
        working-directory: web
        run: npm test

  # The deployed image builds the web app with only `web/` in its context, so a
  # production file importing from outside it fails here and not in `web-unit`.
  docker-web:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Build the web stage of the Docker image
        run: docker build --target web .

  # Implements ADR-0057 (sharding the suite of ADR-0008). The debug binary the
  # Playwright webServers start is built once here, and every shard downloads it.
  e2e-build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [check, clippy, fmt]
    steps:
      - uses: actions/checkout@v4
      - name: Install system libraries
        timeout-minutes: 5
        uses: ./.github/actions/install-system-libraries
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          # The key the single e2e job cached its debug build under.
          shared-key: e2e
      - name: Build chartgen (debug)
        run: cargo build --bin chartgen
      - uses: actions/upload-artifact@v4
        with:
          name: chartgen-e2e-debug
          path: target/debug/chartgen
          retention-days: 1

  # Each shard is its own runner with its own servers, so the single worker of
  # playwright.config.ts still holds inside it. scripts/e2e-shard.mjs assigns whole
  # spec files by measured duration; the shard count is the length of the matrix.
  e2e-shard:
    name: e2e (${{ matrix.shard }}/${{ strategy.job-total }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [build-release, e2e-build]
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: chartgen-e2e-debug
          path: target/debug
      # The steps below run apt themselves, the second through Playwright's --with-deps.
      - name: Choose an apt mirror
        timeout-minutes: 2
        uses: ./.github/actions/install-system-libraries
        with:
          mirror-only: "true"
      - name: Prepare chartgen binary
        run: |
          # Artifacts do not keep the executable bit.
          chmod +x target/debug/chartgen
          # The runner image ships fontconfig and freetype; install them only if not.
          if ldd target/debug/chartgen | grep 'not found'; then
            sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 update
            sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 install -y libfontconfig1 libfreetype6
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install web deps
        working-directory: web
        run: npm ci
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('web/package-lock.json') }}
          restore-keys: |
            playwright-${{ runner.os }}-
      # Playwright's --with-deps runs apt itself: fail a stalled mirror fast there too.
      - name: Configure apt timeouts
        run: printf 'Acquire::Retries "3";\nAcquire::http::Timeout "30";\nAcquire::https::Timeout "30";\n' | sudo tee /etc/apt/apt.conf.d/99ci-timeouts
      - name: Install Playwright Chromium
        timeout-minutes: 10
        working-directory: web
        run: npx playwright install --with-deps chromium
      - name: Run Playwright tests
        timeout-minutes: 25
        working-directory: web
        env:
          CI: "true"
          CHARTGEN_BIN: ${{ github.workspace }}/target/debug/chartgen
          PLAYWRIGHT_BLOB_OUTPUT_NAME: report-${{ matrix.shard }}.zip
        run: |
          specs=$(node ../scripts/e2e-shard.mjs ${{ matrix.shard }} ${{ strategy.job-total }})
          echo "$specs"
          # Without file arguments Playwright would run the whole suite here.
          if [ -z "$specs" ]; then echo "No spec files for this shard."; exit 0; fi
          # shellcheck disable=SC2086 # one spec path per word
          npx playwright test --reporter=blob,list $specs
      - name: Upload blob report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: blob-report-${{ matrix.shard }}
          path: web/blob-report/
          retention-days: 7
      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results-${{ matrix.shard }}
          path: web/test-results/
          retention-days: 7

  # The check that reports the suite as one result under the name it always had.
  e2e:
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [e2e-shard]
    env:
      SHARDS: ${{ needs.e2e-shard.result }}
    steps:
      - uses: actions/checkout@v4
        if: env.SHARDS == 'failure'
      - uses: actions/setup-node@v4
        if: env.SHARDS == 'failure'
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install web deps
        if: env.SHARDS == 'failure'
        working-directory: web
        run: npm ci
      - uses: actions/download-artifact@v4
        if: env.SHARDS == 'failure'
        with:
          path: all-blob-reports
          pattern: blob-report-*
          merge-multiple: true
      - name: Merge shard reports into one HTML report
        if: env.SHARDS == 'failure'
        working-directory: web
        run: npx playwright merge-reports --reporter html ../all-blob-reports
      - name: Upload Playwright report
        if: env.SHARDS == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: web/playwright-report/
          retention-days: 7
      - name: Fail unless every shard passed
        run: |
          echo "e2e shards: $SHARDS"
          test "$SHARDS" = success

  # Implements ADR-0060: the image production runs is built here, not on the host
  # that runs it. It needs every other job, so an image for a commit exists only if
  # this run was green for that commit, and the host deploys only commits that have
  # one (scripts/autodeploy/). Never on a pull request.
  image:
    name: image (linux/arm64)
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/master') }}
    needs:
      - check
      - test
      - clippy
      - no-default-features
      - fmt
      - docs-drift
      - mcp-types-drift
      - build-release
      - macos-build
      - web-unit
      - docker-web
      - e2e
    # A GitHub-hosted arm64 machine: the host is arm64, and nothing is emulated.
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 90
    # The only job of this workflow that may write anything, and only packages: the
    # workflow's own permissions, at the top, are read-only.
    # No concurrency group on purpose: a group keeps one job waiting and cancels it
    # when the next one queues, and image jobs queue as their runs' tests finish, not
    # in commit order, so it could cancel the build of master's head. Builds of
    # different commits may run side by side; the master tag is guarded below.
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Log in to the registry
        env:
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REGISTRY_USER: ${{ github.actor }}
        run: printf '%s' "$REGISTRY_TOKEN" | docker login ghcr.io --username "$REGISTRY_USER" --password-stdin
      - name: Build and push the image of this commit
        env:
          SOURCE: ${{ github.server_url }}/${{ github.repository }}
        run: |
          docker buildx create --name image --use
          docker buildx build \
            --platform linux/arm64 \
            --label "org.opencontainers.image.source=$SOURCE" \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            --cache-from "type=registry,ref=$IMAGE:buildcache" \
            --cache-to "type=registry,ref=$IMAGE:buildcache,mode=max" \
            --tag "$IMAGE:$GITHUB_SHA" \
            --push .
      # Two pushes close together finish in any order. `master` names the image of
      # master's head, so a run whose commit is no longer the head leaves it alone.
      # The look at the head and the write of the tag are two steps, and another run
      # can come between them: so after writing, look again, and if master has moved
      # on meanwhile, give the tag to the head's image if it is there. If it is not
      # there yet, the head's own run moves the tag when it gets here. What deploys
      # goes by the commit SHA, never by this tag. So nothing here may fail the run:
      # the image of this commit is published by now, and a red run would keep the
      # host from deploying it. A registry error while writing the tag is a warning.
      - name: Move the master tag
        if: ${{ github.ref == 'refs/heads/master' }}
        run: |
          head=$(git ls-remote origin refs/heads/master | cut -f1)
          if [ "$head" != "$GITHUB_SHA" ]; then
            echo "master is at $head by now; the master tag stays with the newer run"
            exit 0
          fi
          if ! docker buildx imagetools create --tag "$IMAGE:master" "$IMAGE:$GITHUB_SHA"; then
            echo "::warning::could not move the master tag to $GITHUB_SHA; the image of this commit is published under its SHA"
            exit 0
          fi
          head=$(git ls-remote origin refs/heads/master | cut -f1)
          if [ -n "$head" ] && [ "$head" != "$GITHUB_SHA" ]; then
            echo "master moved to $head while the tag was written"
            docker buildx imagetools create --tag "$IMAGE:master" "$IMAGE:$head" ||
              echo "the image of $head is not there yet; its own run moves the tag"
          fi
