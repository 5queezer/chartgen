[package]
name = "chartgen"
version = "0.8.0"
edition = "2021"
license = "MIT"

[lib]
name = "chartgen"
path = "src/lib.rs"

[[bin]]
name = "chartgen"
path = "src/main.rs"

[dependencies]
plotters = { version = "0.3", default-features = false, features = ["bitmap_backend", "line_series", "bitmap_encoder", "ttf"] }
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
base64 = "0.22"
reqwest = { version = "0.12", features = ["blocking", "json"] }
url = "2"
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "sync"] }
tokio-tungstenite = { version = "0.26", features = ["native-tls"] }
futures-util = "0.3"
tower-http = { version = "0.6", features = ["cors", "fs"] }
sha2 = "0.10"
rand = "0.9"
uuid = { version = "1", features = ["v4"] }
async-trait = "0.1"
hmac = "0.12"
openssl = "0.10"
hex = "0.4"
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.10"
async-stream = "0.3"
starlark = { version = "0.14", optional = true }
rusqlite = { version = "0.41", features = ["bundled"], optional = true }
allocative = { version = "0.3", optional = true }
anyhow = { version = "1", optional = true }
starlark_syntax = { version = "0.14", optional = true }

[features]
default = ["scripting"]
# User-authored Starlark indicators (ADR-0024, ADR-0025); runtime-gated by
# CHARTGEN_SCRIPTING=1. `--no-default-features` builds without starlark
# and rusqlite.
scripting = ["dep:starlark", "dep:starlark_syntax", "dep:allocative", "dep:anyhow", "dep:rusqlite"]

# Published macOS binaries must start without Homebrew's OpenSSL, and nothing else brings
# OpenSSL in there: `native-tls` uses the system's TLS (ADR-0045).
[target.'cfg(target_os = "macos")'.dependencies]
openssl = { version = "0.10", features = ["vendored"] }

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"

[profile.release]
opt-level = "s"
lto = true
strip = true
codegen-units = 1
